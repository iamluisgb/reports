<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Reports — Luis GB</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #10141a;
    --bg-card: #161c25;
    --bg-card-hover: #1a2230;
    --primary: #00ff9d;
    --primary-dim: rgba(0,255,157,0.12);
    --on-surface: #dfe2eb;
    --on-surface-variant: #9a9e96;
    --border: rgba(132,149,135,0.12);
    --wash-green: rgba(0,255,157,0.04);
    --wash-gray: rgba(123,143,163,0.03);
    --red: #f85149;
    --purple: #bc8cff;
    --purple-dim: rgba(188,140,255,0.12);
    --shadow: 0 1px 3px rgba(0,0,0,0.3);
  }

  [data-theme="light"] {
    --bg: #f5f5f0;
    --bg-card: #ffffff;
    --bg-card-hover: #f0f0eb;
    --primary: #0a8a54;
    --primary-dim: rgba(10,138,84,0.1);
    --on-surface: #1a1e26;
    --on-surface-variant: #5a6068;
    --border: rgba(0,0,0,0.08);
    --wash-green: rgba(10,138,84,0.05);
    --wash-gray: rgba(0,0,0,0.02);
    --red: #c0392b;
    --purple: #6c3fc5;
    --purple-dim: rgba(108,63,197,0.1);
    --shadow: 0 1px 3px rgba(0,0,0,0.06);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    font-family: 'Inter', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    transition: background 0.3s, color 0.3s;
  }

  .page {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* ===== HERO ===== */
  .hero {
    position: relative;
    padding: 56px 0 40px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 40px;
    overflow: hidden;
  }

  .hero::after {
    content: "";
    position: absolute;
    width: 500px; height: 400px;
    border-radius: 50%;
    background: radial-gradient(ellipse, var(--wash-green) 0%, transparent 70%);
    filter: blur(60px);
    bottom: -100px; left: -100px;
    pointer-events: none; z-index: 0;
  }
  .hero::before {
    content: "";
    position: absolute;
    width: 400px; height: 300px;
    border-radius: 50%;
    background: radial-gradient(ellipse, var(--wash-gray) 0%, transparent 70%);
    filter: blur(60px);
    top: -80px; right: -80px;
    pointer-events: none; z-index: 0;
  }

  .hero-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    position: relative;
    z-index: 1;
  }

  .hero .logo {
    font-size: 2.8rem;
    margin-bottom: 12px;
  }

  .hero h1 {
    font-family: 'DM Serif Display', serif;
    font-weight: 400;
    font-size: 2.4rem;
    color: var(--on-surface);
    line-height: 1.1;
    letter-spacing: -0.02em;
  }

  .hero .tagline {
    color: var(--on-surface-variant);
    font-size: 15px;
    margin-top: 8px;
    line-height: 1.4;
  }

  .theme-toggle {
    background: none;
    border: 1px solid var(--border);
    color: var(--on-surface-variant);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .theme-toggle:hover {
    border-color: var(--primary);
    color: var(--primary);
  }

  /* Stats */
  .stats {
    display: flex;
    gap: 24px;
    margin-top: 24px;
    position: relative;
    z-index: 1;
  }
  .stat {
    text-align: center;
  }
  .stat .num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--primary);
  }
  .stat .label {
    font-size: 11px;
    color: var(--on-surface-variant);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-top: 2px;
  }

  /* ===== SECTIONS ===== */
  .section {
    margin-bottom: 40px;
  }

  .section-label {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--primary);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-label::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--border);
  }
  .section-label .count {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--on-surface-variant);
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 10px;
    font-family: 'JetBrains Mono', monospace;
  }

  /* ===== CARDS ===== */
  .card {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 18px 20px;
    margin-bottom: 8px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    text-decoration: none;
    color: inherit;
    transition: background 0.2s, border-color 0.2s, transform 0.15s, box-shadow 0.15s;
    position: relative;
  }
  .card:hover {
    background: var(--bg-card-hover);
    border-color: rgba(0,255,157,0.2);
    transform: translateY(-1px);
    box-shadow: var(--shadow);
  }

  .card .icon {
    font-size: 1.4rem;
    flex-shrink: 0;
    width: 36px;
    text-align: center;
    margin-top: 2px;
  }

  .card .content { flex: 1; min-width: 0; }

  .card .title {
    font-family: 'DM Serif Display', serif;
    font-weight: 400;
    font-size: 1.15rem;
    color: var(--on-surface);
    line-height: 1.25;
    margin-bottom: 4px;
  }

  .card .meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--on-surface-variant);
  }

  .card .badge {
    font-size: 9px;
    padding: 3px 8px;
    border-radius: 8px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    flex-shrink: 0;
    align-self: center;
  }
  .badge.new {
    background: rgba(248,81,73,0.12);
    color: var(--red);
    border: 1px solid rgba(248,81,73,0.2);
  }
  .badge.special {
    background: var(--purple-dim);
    color: var(--purple);
    border: 1px solid rgba(188,140,255,0.2);
  }

  /* ===== EMPTY ===== */
  .empty {
    text-align: center;
    padding: 32px 16px;
    color: var(--on-surface-variant);
    font-size: 14px;
  }

  /* ===== LOADING ===== */
  .loading {
    text-align: center;
    padding: 32px;
    color: var(--on-surface-variant);
  }
  .loading .spinner {
    display: inline-block;
    width: 28px; height: 28px;
    border: 2.5px solid var(--border);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ===== FOOTER ===== */
  .footer {
    margin-top: 48px;
    padding: 24px 0;
    border-top: 1px solid var(--border);
    text-align: center;
    font-size: 12px;
    color: var(--on-surface-variant);
  }
  .footer a {
    color: var(--primary);
    text-decoration: none;
  }
  .footer a:hover {
    text-decoration: underline;
  }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 768px) {
    .hero { padding: 40px 0 32px; }
    .hero h1 { font-size: 1.8rem; }
    .hero .logo { font-size: 2.2rem; }
    .stats { gap: 16px; }
    .stat .num { font-size: 1.3rem; }
    .card { padding: 14px 16px; }
    .card .title { font-size: 1.05rem; }
    .hero-top { flex-direction: column; gap: 12px; }
  }
</style>
</head>
<body>
  <div class="page">
    <div class="hero">
      <div class="hero-top">
        <div>
          <div class="logo">🤖</div>
          <h1>AI Reports</h1>
          <div class="tagline">Informes diarios y especiales de inteligencia artificial</div>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()">◐ DARK</button>
      </div>
      <div class="stats">
        <div class="stat">
          <div class="num" id="daily-count">—</div>
          <div class="label">Diarios</div>
        </div>
        <div class="stat">
          <div class="num" id="special-count">—</div>
          <div class="label">Especiales</div>
        </div>
        <div class="stat">
          <div class="num" id="total-count">—</div>
          <div class="label">Total</div>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-label">
        📰 Informes Diarios <span class="count" id="daily-badge">0</span>
      </div>
      <div id="daily-list">
        <div class="loading">
          <div class="spinner"></div>
          <p>Cargando informes...</p>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-label">
        ⭐ Informes Especiales <span class="count" id="special-badge">0</span>
      </div>
      <div id="special-list">
        <div class="loading">
          <div class="spinner"></div>
          <p>Cargando informes...</p>
        </div>
      </div>
    </div>

    <div class="footer">
      Generados automáticamente por <a href="https://github.com/iamluisgb/quiron" target="_blank">Hermes Agent</a> · <a href="https://github.com/iamluisgb/reports" target="_blank">GitHub</a>
    </div>
  </div>

<script>
  const REPO_OWNER = 'iamluisgb';
  const REPO_NAME = 'reports';
  const BRANCH = 'master';
  const API_URL = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/reports?ref=${BRANCH}`;

  function extractDateFromFilename(filename) {
    const match = filename.match(/(\d{4})-(\d{2})-(\d{2})/);
    if (match) {
      return new Date(`${match[1]}-${match[2]}-${match[3]}T12:00:00`);
    }
    return null;
  }

  function formatDate(dateStr) {
    const d = extractDateFromFilename(dateStr);
    if (d) {
      return d.toLocaleDateString('es-ES', {
        day: 'numeric',
        month: 'short',
        year: 'numeric'
      });
    }
    return '—';
  }

  function isDaily(filename) {
    return filename.startsWith('ai-news-') && filename.endsWith('.html');
  }

  function isSpecial(filename) {
    return filename.endsWith('.html') && !isDaily(filename);
  }

  function getReportDate(filename) {
    const parts = filename.replace('.html', '').split('-');
    if (parts.length >= 3) {
      const y = parts[parts.length - 3];
      const m = parts[parts.length - 2];
      const d = parts[parts.length - 1];
      return new Date(`${y}-${m}-${d}T00:00:00`);
    }
    return new Date(0);
  }

  function getPagesUrl(filename) {
    return `https://iamluisgb.github.io/reports/reports/${filename}`;
  }

  function renderCard(item, type) {
    const isNew = item.name === 'ai-news-2026-05-15.html';
    const pagesUrl = getPagesUrl(item.name);
    const title = type === 'daily' ? 'AI News Daily' : item.name.replace('.html', '');
    const badgeHtml = isNew
      ? '<span class="badge new">Nuevo</span>'
      : (type === 'special' ? '<span class="badge special">Special</span>' : '');
    return `
      <a class="card" href="${pagesUrl}" target="_blank">
        <div class="icon">${type === 'daily' ? '📰' : '⭐'}</div>
        <div class="content">
          <div class="title">${title}</div>
          <div class="meta">${formatDate(item.name)}</div>
        </div>
        ${badgeHtml}
      </a>
    `;
  }

  async function loadReports() {
    try {
      const res = await fetch(API_URL + '&t=' + Date.now());
      if (!res.ok) throw new Error('API error');
      const files = await res.json();

      const dailyFiles = files
        .filter(f => f.type === 'file' && f.name !== 'index.html' && isDaily(f.name))
        .sort((a, b) => getReportDate(b.name) - getReportDate(a.name));

      const specialFiles = files
        .filter(f => f.type === 'file' && f.name !== 'index.html' && isSpecial(f.name))
        .sort((a, b) => getReportDate(b.name) - getReportDate(a.name));

      const dailyList = document.getElementById('daily-list');
      if (dailyFiles.length === 0) {
        dailyList.innerHTML = '<div class="empty">No hay informes diarios aún.</div>';
      } else {
        dailyList.innerHTML = dailyFiles.map(f => renderCard(f, 'daily')).join('');
      }

      const specialList = document.getElementById('special-list');
      if (specialFiles.length === 0) {
        specialList.innerHTML = '<div class="empty">No hay informes especiales aún.</div>';
      } else {
        specialList.innerHTML = specialFiles.map(f => renderCard(f, 'special')).join('');
      }

      document.getElementById('daily-count').textContent = dailyFiles.length;
      document.getElementById('special-count').textContent = specialFiles.length;
      document.getElementById('total-count').textContent = dailyFiles.length + specialFiles.length;
      document.getElementById('daily-badge').textContent = dailyFiles.length;
      document.getElementById('special-badge').textContent = specialFiles.length;

    } catch (err) {
      console.error(err);
      document.getElementById('daily-list').innerHTML = '<div class="empty">Error al cargar los informes.</div>';
      document.getElementById('special-list').innerHTML = '<div class="empty">Error al cargar los informes.</div>';
    }
  }

  function toggleTheme() {
    const html = document.documentElement;
    const btn = document.querySelector('.theme-toggle');
    if (html.getAttribute('data-theme') === 'light') {
      html.removeAttribute('data-theme');
      btn.textContent = '◐ DARK';
    } else {
      html.setAttribute('data-theme', 'light');
      btn.textContent = '◑ LIGHT';
    }
  }

  loadReports();
</script>
</body>
</html>
