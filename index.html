<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Reports — Luis GB</title>
<meta name="description" content="Daily and special reports on artificial intelligence, generated by Hermes Agent. Follow the latest in AI, agents, models, and AI engineering.">
<link rel="canonical" href="https://luisgonzalezbernal.com/reports/">
<meta property="og:title" content="AI Reports — Luis GB">
<meta property="og:description" content="Daily and special reports on artificial intelligence. Follow the latest in AI, agents, models, and AI engineering.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://luisgonzalezbernal.com/reports/">
<meta property="og:site_name" content="AI Reports — Luis GB">
<meta property="og:image" content="https://luisgonzalezbernal.com/reports/og/og-default.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<meta name="twitter:site" content="@iamluisgb">
<meta name="twitter:creator" content="@iamluisgb">
<meta name="twitter:title" content="AI Reports — Luis GB">
<meta name="twitter:description" content="Daily and special reports on artificial intelligence, generated by Hermes Agent.">
<meta name="twitter:image" content="https://luisgonzalezbernal.com/reports/og/og-default.png">
<link rel="alternate" type="application/rss+xml" title="AI Reports RSS" href="/reports/rss.xml">
<link rel="sitemap" type="application/xml" href="/reports/sitemap.xml">

<link rel="stylesheet" href="home.css">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "AI Reports — Luis GB",
  "url": "https://luisgonzalezbernal.com/reports/",
  "description": "Daily and special reports on artificial intelligence — models, agents, security, and AI engineering. Generated by Hermes Agent.",
  "inLanguage": "en",
  "publisher": {
    "@type": "Person",
    "name": "Luis González",
    "url": "https://luisgonzalezbernal.com",
    "sameAs": [
      "https://twitter.com/iamluisgb",
      "https://www.linkedin.com/in/iamluisgb"
    ]
  },
  "potentialAction": {
    "@type": "SearchAction",
    "target": "https://luisgonzalezbernal.com/reports/?q={search_term_string}",
    "query-input": "required name=search_term_string"
  }
}
</script>
<script>try{if(localStorage.getItem('ai-reports-theme')==='light')document.documentElement.setAttribute('data-theme','light')}catch(e){}</script>
</head>
<body>
  <a href="#archive" class="skip-link">Skip to reports</a>

  <div class="topbar" id="topbar" aria-hidden="true">
    <div class="topbar-in">
      <button class="topbar-brand" type="button" id="to-top" tabindex="-1">AI <em>Reports</em></button>
      <button class="btn btn-sm btn-search" type="button" data-search tabindex="-1">Search <span class="kbd">⌘K</span></button>
      <button class="btn btn-sm" type="button" data-theme-toggle tabindex="-1">◐</button>
    </div>
  </div>

  <main class="home">
    <header class="mast" id="mast">
      <div>
        <div class="eyebrow"><b>AI Research Briefing</b> · <span id="m-count">—</span> reports<span id="m-updated"></span></div>
        <h1>AI <em>Reports</em></h1>
      </div>
      <div class="tools">
        <button class="btn btn-search" type="button" data-search>Search reports <span class="kbd">⌘K</span></button>
        <a class="btn hide-sm" href="/reports/about.html">About</a>
        <a class="btn hide-sm" href="/reports/rss.xml">RSS</a>
        <button class="btn" type="button" data-theme-toggle>◐</button>
      </div>
    </header>
    <div class="topics" id="topics" role="group" aria-label="Filter by topic"></div>
    <div class="status" id="status" role="status" aria-live="polite"></div>

    <noscript>
      <div class="empty">This index needs JavaScript to list reports. You can still browse via the
        <a href="/reports/rss.xml" style="color:var(--primary)">RSS feed</a> or read
        <a href="/reports/about.html" style="color:var(--primary)">About</a>.</div>
    </noscript>

    <section class="today" id="today" aria-label="Latest briefing"><div class="loading">Loading reports…</div></section>

    <section class="sec" id="calendar" hidden>
      <div class="sec-head"><h3>Every day since <span id="cal-since"></span></h3><span class="eyebrow" id="cal-meta"></span></div>
      <div class="cal-wrap">
        <div class="cal-scroll"><div class="cal" id="cal"></div></div>
        <div class="facts" id="facts"></div>
      </div>
      <div class="cal-foot"><span>Darker means a longer briefing. Hover a day for its headline.</span>
        <span class="legend" aria-hidden="true">Short <i class="cell l1"></i><i class="cell l2"></i><i class="cell l3"></i><i class="cell l4"></i> Long</span></div>
    </section>

    <section class="sec" id="special">
      <div class="sec-head"><h3>Special reports</h3><span class="eyebrow" id="sp-meta"></span></div>
      <div class="specials" id="specials"></div>
      <div style="padding-top:6px"><button class="link" id="sp-more" type="button" hidden></button></div>
    </section>

    <section class="sec" id="archive" tabindex="-1">
      <div class="sec-head"><h3>Daily archive</h3><span class="eyebrow" id="ar-meta"></span></div>
      <div id="months"></div>
    </section>

    <footer class="foot">
      <span>Generated daily by <a href="https://github.com/iamluisgb/quiron" target="_blank" rel="noopener">Hermes Agent</a></span>
      <span><a href="https://github.com/iamluisgb/reports" target="_blank" rel="noopener">GitHub</a> · <a href="/reports/about.html">About</a> · <a href="/reports/rss.xml">RSS</a> · <a href="/reports/patterns.html">Patterns</a> · @iamluisgb</span>
    </footer>
  </main>

  <div class="tip" id="tip" role="tooltip"></div>
  <div id="pal-root" hidden></div>

<script src="site.js"></script>
<script>
  const { MONTHS, MONTHS_LONG, WEEKDAYS, esc, parseDate: pd, fmtDate: fmt, isBroken, headline, initPlayer, reduce } = window.Site;
  const UBIQ = new Set(['models', 'agents', 'research']);   // on >90% of reports: they don't discriminate
  const $ = id => document.getElementById(id);
  const topicLabel = t => t.replace(/-/g, ' ').replace(/^./, c => c.toUpperCase());
  const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const href = r => 'reports/' + encodeURI(r.file);
  const isSpanish = s => /[áéíóúñ¿¡]|\b(los|las|del)\b/i.test(s);
  const vtName = r => 'r-' + r.file.replace(/\.html$/, '').replace(/[^a-z0-9-]/gi, '-');

  let reports = [], daily = [], special = [], byFile = {};
  const active = new Set();
  let showAll = false;
  let namedRender = false;   // per-row view-transition names, only while a filter change animates

  const matches = r => !active.size || r.tags.some(t => active.has(t));

  /* ---------- Transitions ---------- */
  function animateFilter(update) {
    if (!document.startViewTransition || reduce) { update(); return; }
    namedRender = true;
    document.querySelectorAll('[data-vt]').forEach(n => { n.style.viewTransitionName = n.dataset.vt; });
    const vt = document.startViewTransition(update);
    const done = () => {
      namedRender = false;
      document.querySelectorAll('[data-vt]').forEach(n => { n.style.viewTransitionName = ''; });
    };
    vt.finished.then(done, done);
  }
  // Cross-document transition: the clicked title morphs into the report's <h1>.
  document.addEventListener('click', e => {
    const a = e.target.closest('a[data-file]');
    if (!a || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button) return;
    document.querySelectorAll('.vt-headline').forEach(n => { n.style.viewTransitionName = ''; n.classList.remove('vt-headline'); });
    const t = a.querySelector('h4, .lead') || a;
    t.style.viewTransitionName = 'headline';
    t.classList.add('vt-headline');
  });

  /* ---------- Topics (multi-select OR, URL-addressable via ?topic=a,b) ---------- */
  function readTopicsFromUrl() {
    const param = new URLSearchParams(location.search).get('topic');
    if (param) param.split(',').map(s => s.trim()).filter(Boolean).forEach(t => active.add(t));
  }
  function syncTopicsToUrl() {
    const url = new URL(location.href);
    if (active.size) url.searchParams.set('topic', [...active].join(','));
    else url.searchParams.delete('topic');
    history.replaceState(null, '', url);
  }
  function renderTopics() {
    const counts = {};
    reports.forEach(r => r.tags.forEach(t => { if (!UBIQ.has(t) || active.has(t)) counts[t] = (counts[t] || 0) + 1; }));
    $('topics').innerHTML = '<span class="eyebrow">Topics</span>' +
      Object.entries(counts).sort((a, b) => b[1] - a[1]).map(([t, n]) =>
        `<button class="chip" type="button" data-t="${esc(t)}" aria-pressed="${active.has(t)}">${esc(topicLabel(t))}<span>${n}</span></button>`).join('') +
      (active.size ? '<button class="link" type="button" id="clear">Clear</button>' : '');
  }
  $('topics').addEventListener('click', e => {
    const chip = e.target.closest('.chip');
    if (chip) { const t = chip.dataset.t; active.has(t) ? active.delete(t) : active.add(t); }
    else if (e.target.id === 'clear') active.clear();
    else return;
    syncTopicsToUrl();
    animateFilter(() => { renderTopics(); render(); });
  });

  /* ---------- Latest briefing ---------- */
  function renderToday() {
    const t = daily[0], y = daily[1];
    if (!t) { $('today').hidden = true; return; }
    const d = pd(t.date), items = isBroken(t) ? [] : t.summary.split(' · ');
    const stem = t.file.replace(/\.html$/, '');
    $('today').innerHTML = `
      <div>
        <div class="eyebrow"><b>Latest</b> · ${WEEKDAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]} · ${t.readingTime} min read</div>
        <h2><a href="${href(t)}" data-file="${esc(t.file)}">${esc(headline(t))}</a></h2>
        <ol>${items.slice(1).map(s => `<li>${esc(s)}</li>`).join('')}</ol>
      </div>
      <div class="side">
        ${t.audio ? `<div class="audio-player">
          <audio preload="none" src="audio/${esc(stem)}.mp3"></audio>
          <button class="play-btn" type="button" aria-label="Play audio briefing">
            <svg class="icon-play" viewBox="0 0 16 16"><path d="M4 2l10 6-10 6V2z"/></svg>
            <svg class="icon-pause" viewBox="0 0 16 16"><path d="M3 2h3.5v12H3zM9.5 2H13v12H9.5z"/></svg>
          </button>
          <div class="player-body">
            <div class="player-meta"><span class="player-title">Audio briefing</span><span class="player-time"></span></div>
            <input type="range" min="0" max="100" value="0" step="0.1" aria-label="Seek">
          </div>
        </div>` : ''}
        <a class="btn-primary" href="${href(t)}" data-file="${esc(t.file)}">Read the briefing <span class="arrow">→</span></a>
        ${y ? `<div class="yday">Yesterday: <a href="${href(y)}" data-file="${esc(y.file)}">${esc(headline(y))}</a></div>` : ''}
      </div>`;
    const player = $('today').querySelector('.audio-player');
    if (player) initPlayer(player);
  }

  /* ---------- Calendar ---------- */
  function renderCalendar() {
    if (daily.length < 7) return;
    const byDate = {};
    daily.forEach(r => { if (!byDate[r.date]) byDate[r.date] = r; });
    const first = pd(daily[daily.length - 1].date), last = pd(daily[0].date);
    const start = new Date(first); start.setDate(start.getDate() - ((start.getDay() + 6) % 7));   // back to Monday
    const html = ['<span></span>', ...['Mon', '', 'Wed', '', 'Fri', '', ''].map(w => `<span class="wd">${w}</span>`)];
    let missing = 0, lastMonth = -1;
    for (const cur = new Date(start); cur <= last;) {
      const m = cur.getMonth();
      html.push(`<span class="ml">${m !== lastMonth && cur.getDate() <= 7 ? MONTHS[m] : ''}</span>`);
      if (cur.getDate() <= 7) lastMonth = m;
      for (let i = 0; i < 7; i++, cur.setDate(cur.getDate() + 1)) {
        const k = iso(cur), r = byDate[k];
        if (cur < first || cur > last) html.push('<span></span>');
        else if (!r) { missing++; html.push(`<span class="cell" title="${fmt(k)} · no briefing"></span>`); }
        else {
          const lvl = r.readingTime <= 3 ? 1 : r.readingTime <= 6 ? 2 : r.readingTime <= 8 ? 3 : 4;
          html.push(`<a class="cell l${lvl}" href="${href(r)}" data-tip="${esc(r.file)}" aria-label="${fmt(k)}: ${esc(headline(r))}"></a>`);
        }
      }
    }
    $('cal').innerHTML = html.join('');
    const days = Object.keys(byDate).length;
    let streak = 0;
    for (const d = new Date(last); byDate[iso(d)]; d.setDate(d.getDate() - 1)) streak++;
    const avg = Math.round(daily.reduce((s, r) => s + r.readingTime, 0) / daily.length);
    const longest = daily.reduce((a, r) => r.readingTime > a.readingTime ? r : a);
    $('cal-since').textContent = MONTHS_LONG[first.getMonth()];
    $('cal-meta').textContent = missing ? `${days} days covered · ${missing} missed` : `${days} days · none missed`;
    $('facts').innerHTML = `
      <div class="fact"><div class="n">${streak}</div><div class="k">day streak</div></div>
      <div class="fact"><div class="n">${avg}<small> min</small></div><div class="k">average briefing</div></div>
      <a class="fact" href="${href(longest)}" data-file="${esc(longest.file)}"><div class="n">${longest.readingTime}<small> min</small></div><div class="k">longest, ${fmt(longest.date).replace(/ \d{4}$/, '')} <span class="arrow">→</span></div></a>`;
    $('calendar').hidden = false;
  }

  const tip = $('tip');
  function showTip(el) {
    const r = byFile[el.dataset.tip]; if (!r) return;
    tip.innerHTML = `<span class="eyebrow">${fmt(r.date)} · ${r.readingTime} min</span>${esc(headline(r))}`;
    tip.classList.add('on');
    const b = el.getBoundingClientRect(), w = tip.offsetWidth;
    tip.style.left = Math.max(8, Math.min(innerWidth - w - 8, b.left + b.width / 2 - w / 2)) + 'px';
    tip.style.top = Math.max(8, b.top - tip.offsetHeight - 8) + 'px';
  }
  const tipFor = e => { const c = e.target.closest && e.target.closest('[data-tip]'); c ? showTip(c) : tip.classList.remove('on'); };
  document.addEventListener('mouseover', tipFor);
  document.addEventListener('focusin', tipFor);
  addEventListener('scroll', () => tip.classList.remove('on'), { passive: true });

  /* ---------- Special reports + daily archive ---------- */
  function render() {
    const sp = special.filter(matches), dl = daily.filter(matches), filtering = active.size > 0;
    const vt = r => `data-vt="${vtName(r)}"${namedRender ? ` style="view-transition-name:${vtName(r)}"` : ''}`;
    $('status').textContent = filtering ? `${sp.length + dl.length} of ${reports.length} reports match` : '';
    $('today').hidden = filtering || !daily.length;
    document.querySelectorAll('#cal a.cell').forEach(c => c.classList.toggle('dim', !matches(byFile[c.dataset.tip])));

    const shown = (showAll || filtering) ? sp : sp.slice(0, 6);
    $('sp-meta').textContent = sp.length ? `${sp.length} reports · ${Math.min(...sp.map(r => r.readingTime))}–${Math.max(...sp.map(r => r.readingTime))} min reads` : '';
    $('specials').innerHTML = shown.length ? shown.map(r => `
      <a class="sp" href="${href(r)}" data-file="${esc(r.file)}" ${vt(r)}>
        <div class="eyebrow"><b>${esc(r.series || 'Special report')}</b></div>
        <h4>${esc(headline(r))}${isSpanish(r.title) ? '<span class="lang" title="In Spanish">ES</span>' : ''}</h4>
        <p>${esc(r.summary)}</p>
        <div class="meta"><span>${fmt(r.date)}</span><span>${r.readingTime} min <span class="arrow">→</span></span></div>
      </a>`).join('') : '<div class="empty">No special reports on these topics yet.</div>';
    $('sp-more').hidden = filtering || sp.length <= 6;
    $('sp-more').textContent = showAll ? 'Show fewer' : `Show all ${sp.length} special reports`;

    const list = filtering ? dl : dl.slice(1);
    $('ar-meta').textContent = `${dl.length} daily briefings`;
    const groups = [];
    list.forEach(r => {
      const d = pd(r.date), key = d.getFullYear() * 12 + d.getMonth();
      let g = groups[groups.length - 1];
      if (!g || g.key !== key) groups.push(g = { key, name: `${MONTHS_LONG[d.getMonth()]} ${d.getFullYear()}`, items: [] });
      g.items.push(r);
    });
    $('months').innerHTML = groups.length ? groups.map(g => `
      <div class="month">
        <div class="month-h"><h5>${g.name}</h5><span class="eyebrow">${g.items.length}</span></div>
        ${g.items.map(r => {
          const d = pd(r.date), tags = r.tags.filter(t => !UBIQ.has(t)).slice(0, 2).map(topicLabel).join(' · ');
          const parts = isBroken(r) ? ['AI News Daily'] : r.summary.split(' · ');
          return `<a class="row" href="${href(r)}" data-file="${esc(r.file)}" ${vt(r)}>
            <span class="d"><b>${String(d.getDate()).padStart(2, '0')}</b> ${WEEKDAYS[d.getDay()].slice(0, 3)}</span>
            <span class="t"><span class="lead">${esc(parts[0])}</span>${parts.length > 1 ? `<span class="rest"> · ${esc(parts.slice(1).join(' · '))}</span>` : ''}${isSpanish(r.summary) ? '<span class="lang" title="In Spanish">ES</span>' : ''}</span>
            <span class="r">${tags ? `<span class="tg">${esc(tags)}</span>` : ''}<span>${r.readingTime} min</span></span>
          </a>`;
        }).join('')}
      </div>`).join('') : '<div class="empty">No daily briefings on these topics.</div>';
  }
  $('sp-more').onclick = () => { showAll = !showAll; render(); };

  /* ---------- Search palette (⌘K, /, or ?q=) ---------- */
  const palRoot = $('pal-root');
  let sel = 0, results = [], lastFocus = null;
  function search(q) {
    const words = q.toLowerCase().split(/\s+/).filter(Boolean);
    if (!words.length) return reports.slice(0, 8);
    return reports.filter(r => {
      const hay = `${r.title} ${r.summary} ${r.tags.join(' ')} ${r.series || ''} ${MONTHS_LONG[pd(r.date).getMonth()]} ${r.date}`.toLowerCase();
      return words.every(w => hay.includes(w));
    }).slice(0, 30);
  }
  function paintResults() {
    const list = palRoot.querySelector('.pal-list');
    list.innerHTML = results.length ? results.map((r, i) => `
      <a class="pal-item" role="option" id="opt-${i}" aria-selected="${i === sel}" href="${href(r)}">
        <span class="pt">${esc(headline(r))}</span><span class="pm">${r.type === 'daily' ? 'Daily' : 'Special'} · ${fmt(r.date)}</span>
        <span class="ps">${esc(r.summary)}</span>
      </a>`).join('') : '<div class="empty" style="padding:18px 12px">Nothing matches. Try a company, a model or a month.</div>';
    palRoot.querySelector('input').setAttribute('aria-activedescendant', results.length ? 'opt-' + sel : '');
    const s = list.querySelector('[aria-selected="true"]');
    if (s) s.scrollIntoView({ block: 'nearest' });
  }
  function openPalette(q = '') {
    if (!palRoot.hidden || !reports.length) return;
    lastFocus = document.activeElement;
    palRoot.hidden = false;
    palRoot.innerHTML = `<div class="pal-back" id="pal-back">
      <div class="pal" role="dialog" aria-modal="true" aria-label="Search reports">
        <div class="pal-in"><span aria-hidden="true">⌕</span><input id="pal-q" type="text" placeholder="Search ${reports.length} reports…" role="combobox" aria-expanded="true" aria-controls="pal-list" autocomplete="off" spellcheck="false"><span class="kbd">esc</span></div>
        <div class="pal-list" id="pal-list" role="listbox"></div>
        <div class="pal-foot"><span>↑↓ move</span><span>↵ open</span><span>esc close</span></div>
      </div></div>`;
    const input = $('pal-q');
    input.value = q;
    sel = 0; results = search(q); paintResults();
    input.oninput = () => { sel = 0; results = search(input.value); paintResults(); };
    input.onkeydown = e => {
      if (e.key === 'ArrowDown') { sel = Math.min(results.length - 1, sel + 1); paintResults(); e.preventDefault(); }
      else if (e.key === 'ArrowUp') { sel = Math.max(0, sel - 1); paintResults(); e.preventDefault(); }
      else if (e.key === 'Enter' && results[sel]) location.href = href(results[sel]);
      else if (e.key === 'Tab') e.preventDefault();
    };
    $('pal-back').onclick = e => { if (e.target.id === 'pal-back') closePalette(); };
    input.focus();
  }
  function closePalette() {
    palRoot.hidden = true; palRoot.innerHTML = '';
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  document.addEventListener('keydown', e => {
    const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if ((e.key === 'k' && (e.metaKey || e.ctrlKey)) || (e.key === '/' && !typing)) { e.preventDefault(); openPalette(); }
    else if (e.key === 'Escape' && !palRoot.hidden) closePalette();
  });
  document.querySelectorAll('[data-search]').forEach(b => b.addEventListener('click', () => openPalette()));

  /* ---------- Top bar ---------- */
  const bar = $('topbar');
  new IntersectionObserver(([en]) => {
    const on = !en.isIntersecting && en.boundingClientRect.top < 0;
    bar.classList.toggle('on', on);
    bar.setAttribute('aria-hidden', String(!on));
    bar.querySelectorAll('button').forEach(b => { b.tabIndex = on ? 0 : -1; });
  }).observe($('mast'));
  $('to-top').onclick = () => scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });

  /* ---------- Load ---------- */
  async function loadReports() {
    try {
      const res = await fetch('reports.json', { cache: 'no-cache' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      reports = (data.reports || []).slice().sort((a, b) => b.date.localeCompare(a.date) || a.file.localeCompare(b.file));
      daily = reports.filter(r => r.type === 'daily');
      special = reports.filter(r => r.type === 'special');
      byFile = Object.fromEntries(reports.map(r => [r.file, r]));
      $('m-count').textContent = reports.length;
      if (daily[0]) { const d = pd(daily[0].date); $('m-updated').textContent = ` · updated ${d.getDate()} ${MONTHS[d.getMonth()]}`; }
      readTopicsFromUrl();
      renderTopics();
      renderToday();
      renderCalendar();
      render();
      const q = new URLSearchParams(location.search).get('q');
      if (q) openPalette(q);
    } catch (err) {
      console.error(err);
      $('today').innerHTML = '<div class="empty">The report list could not be loaded. Reload the page, or browse via the <a href="/reports/rss.xml" style="color:var(--primary)">RSS feed</a>.</div>';
    }
  }
  loadReports();
</script>
</body>
</html>
