<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Reports — Luis GB</title>
    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --border: #30363d;
            --text: #c9d1d9;
            --heading: #e6edf3;
            --accent: #58a6ff;
            --green: #3fb950;
            --orange: #d29922;
            --red: #f85149;
            --link: #58a6ff;
            --purple: #bc8cff;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* Hero */
        .hero {
            text-align: center;
            padding: 4rem 1.5rem 2rem;
            background: linear-gradient(180deg, #161b22 0%, var(--bg) 100%);
            border-bottom: 1px solid var(--border);
        }
        .hero h1 {
            font-size: 2.5rem;
            color: var(--heading);
            margin-bottom: 0.5rem;
        }
        .hero p {
            color: #8b949e;
            font-size: 1.1rem;
            max-width: 500px;
            margin: 0 auto;
        }
        .hero .logo {
            font-size: 3.5rem;
            margin-bottom: 1rem;
        }

        /* Container */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        /* Section */
        .section {
            margin-bottom: 3rem;
        }
        .section-header {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            margin-bottom: 1.2rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border);
        }
        .section-header h2 {
            font-size: 1.4rem;
            color: var(--heading);
        }
        .section-header .count {
            background: var(--card);
            border: 1px solid var(--border);
            color: #8b949e;
            font-size: 0.8rem;
            padding: 0.15rem 0.6rem;
            border-radius: 12px;
        }

        /* Card */
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1.2rem 1.4rem;
            margin-bottom: 0.8rem;
            display: flex;
            align-items: flex-start;
            gap: 1rem;
            transition: border-color 0.2s, transform 0.15s;
            text-decoration: none;
            color: inherit;
        }
        .card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }
        .card .icon {
            font-size: 1.5rem;
            flex-shrink: 0;
            width: 40px;
            text-align: center;
        }
        .card .content { flex: 1; min-width: 0; }
        .card .title {
            color: var(--heading);
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.2rem;
        }
        .card .meta {
            font-size: 0.85rem;
            color: #8b949e;
        }
        .card .badge {
            display: inline-block;
            font-size: 0.7rem;
            padding: 0.1rem 0.5rem;
            border-radius: 12px;
            font-weight: 600;
            text-transform: uppercase;
            flex-shrink: 0;
        }
        .badge.daily { background: #1f6feb22; color: var(--accent); border: 1px solid #1f6feb44; }
        .badge.special { background: #8b5cf622; color: var(--purple); border: 1px solid #8b5cf644; }
        .badge.new { background: #da363322; color: var(--red); border: 1px solid #da363344; }

        /* Loading */
        .loading {
            text-align: center;
            padding: 3rem;
            color: #8b949e;
        }
        .loading .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 1rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Empty */
        .empty {
            text-align: center;
            padding: 2rem;
            color: #8b949e;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 2rem 1.5rem;
            border-top: 1px solid var(--border);
            color: #8b949e;
            font-size: 0.85rem;
        }
        footer a { color: var(--accent); }

        /* Stats bar */
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: 1.5rem;
            flex-wrap: wrap;
        }
        .stat {
            text-align: center;
        }
        .stat .num {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--green);
            font-family: monospace;
        }
        .stat .label {
            font-size: 0.8rem;
            color: #8b949e;
        }

        @media (max-width: 600px) {
            .hero { padding: 2.5rem 1rem 1.5rem; }
            .hero h1 { font-size: 1.8rem; }
            .hero .logo { font-size: 2.5rem; }
            .container { padding: 1.5rem 1rem; }
            .stats-bar { gap: 1.2rem; }
        }
    </style>
</head>
<body>

    <div class="hero">
        <div class="logo">🤖</div>
        <h1>AI Reports</h1>
        <p>Informes diarios y especiales de inteligencia artificial</p>
        <div class="stats-bar">
            <div class="stat">
                <div class="num" id="daily-count">—</div>
                <div class="label">Diarios</div>
            </div>
            <div class="stat">
                <div class="num" id="special-count">—</div>
                <div class="label">Especiales</div>
            </div>
            <div class="stat">
                <div class="num" id="total-count">—</div>
                <div class="label">Total</div>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="section">
            <div class="section-header">
                <h2>📰 Informes Diarios</h2>
                <span class="count" id="daily-badge">0</span>
            </div>
            <div id="daily-list">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Cargando informes...</p>
                </div>
            </div>
        </div>

        <div class="section">
            <div class="section-header">
                <h2>⭐ Informes Especiales</h2>
                <span class="count" id="special-badge">0</span>
            </div>
            <div id="special-list">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Cargando informes...</p>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>Generados automáticamente por <a href="https://github.com/iamluisgb/quiron" target="_blank">Hermes Agent</a> · <a href="https://github.com/iamluisgb/reports" target="_blank">GitHub</a></p>
    </footer>

    <script>
        const REPO_OWNER = 'iamluisgb';
        const REPO_NAME = 'reports';
        const BRANCH = 'master';
        const API_URL = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents`;

        const icons = {
            'daily': '📰',
            'special': '⭐'
        };

        function formatDate(dateStr) {
            const d = new Date(dateStr);
            return d.toLocaleDateString('es-ES', {
                day: 'numeric',
                month: 'short',
                year: 'numeric'
            });
        }

        function isDaily(filename) {
            return filename.startsWith('ai-news-') && filename.endsWith('.html');
        }

        function isSpecial(filename) {
            return filename.endsWith('.html') && !isDaily(filename);
        }

        function getReportDate(filename) {
            const match = filename.match(/(\d{4}-\d{2}-\d{2})/);
            if (match) return new Date(match[1]);
            return new Date(0);
        }

        function renderCard(item, type) {
            const isNew = item.name === 'ai-news-2026-05-15.html';
            return `
                <a class="card" href="${item.html_url}" target="_blank">
                    <div class="icon">${icons[type]}</div>
                    <div class="content">
                        <div class="title">${type === 'daily' ? 'AI News Daily' : item.name.replace('.html', '')}</div>
                        <div class="meta">${formatDate(item.name)}</div>
                    </div>
                    ${isNew ? '<span class="badge new">NUEVO</span>' : ''}
                </a>
            `;
        }

        async function loadReports() {
            try {
                const res = await fetch(`${API_URL}?ref=${BRANCH}`);
                if (!res.ok) throw new Error('API error');
                const files = await res.json();

                const dailyFiles = files
                    .filter(f => f.type === 'file' && isDaily(f.name))
                    .sort((a, b) => getReportDate(b.name) - getReportDate(a.name));

                const specialFiles = files
                    .filter(f => f.type === 'file' && isSpecial(f.name))
                    .sort((a, b) => getReportDate(b.name) - getReportDate(a.name));

                // Render daily
                const dailyList = document.getElementById('daily-list');
                if (dailyFiles.length === 0) {
                    dailyList.innerHTML = '<div class="empty">No hay informes diarios aún.</div>';
                } else {
                    dailyList.innerHTML = dailyFiles.map(f => renderCard(f, 'daily')).join('');
                }

                // Render special
                const specialList = document.getElementById('special-list');
                if (specialFiles.length === 0) {
                    specialList.innerHTML = '<div class="empty">No hay informes especiales aún.</div>';
                } else {
                    specialList.innerHTML = specialFiles.map(f => renderCard(f, 'special')).join('');
                }

                // Update counts
                document.getElementById('daily-count').textContent = dailyFiles.length;
                document.getElementById('special-count').textContent = specialFiles.length;
                document.getElementById('total-count').textContent = dailyFiles.length + specialFiles.length;
                document.getElementById('daily-badge').textContent = dailyFiles.length;
                document.getElementById('special-badge').textContent = specialFiles.length;

            } catch (err) {
                console.error(err);
                document.getElementById('daily-list').innerHTML = '<div class="empty">Error al cargar los informes.</div>';
                document.getElementById('special-list').innerHTML = '<div class="empty">Error al cargar los informes.</div>';
            }
        }

        loadReports();
    </script>

</body>
</html>
