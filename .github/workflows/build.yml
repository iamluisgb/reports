name: Build manifest

# Regenerates reports.json, sitemap.xml and rss.xml, builds the per-report Open
# Graph images (og/) and injects social meta tags into each report's <head>
# whenever a report is added or changed under reports/.
#
# Loop safety: both build steps are idempotent. The first run after a new report
# injects meta into reports/*.html and commits it, which re-triggers this
# workflow once; the second run finds the meta already present (no diff) and the
# `git diff --staged --quiet` guard skips the commit, so it converges. OG images
# live at the repo root under og/ and never re-trigger the workflow.

on:
  push:
    branches: [master]
    paths:
      - 'reports/**'
      - 'scripts/generate_manifest.py'
      - 'scripts/build_social.py'
      - 'scripts/build_index.py'
      - 'scripts/build_agent_files.py'
      - 'styles.css'          # tokens.json is generated from it
      - 'index.html'
      - 'assets/fonts/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-manifest
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history: needed to date specials with no date in name/content

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet Pillow

      - name: Generate manifest, sitemap and RSS
        run: python3 scripts/generate_manifest.py

      - name: Build OG images and inject social meta
        run: python3 scripts/build_social.py

      - name: Commit generated files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports.json sitemap.xml rss.xml og reports index.html sitemap.md tokens.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "🤖 Rebuild manifest, RSS, OG images and social meta"
            git push
          fi

      # Design system: token contrast, byte budgets, and the markup rules in AGENTS.md
      # for the reports this push touched. Like the check below, it runs after the
      # commit so the manifest is rebuilt anyway; a violation turns the run red.
      - name: Check design system
        if: ${{ github.event_name == 'push' && !startsWith(github.event.before, '0000000') }}
        run: |
          mapfile -t changed < <(git diff --name-only --diff-filter=AM \
            "${{ github.event.before }}" "${{ github.sha }}" -- 'reports/*.html')
          python3 scripts/check_design.py "${changed[@]:-__none__}"

      # Last, so a bad report still gets its manifest rebuilt — but the run goes
      # red (and GitHub emails) when a pushed daily shows fabrication signals.
      - name: Check pushed dailies for fabrication signals
        if: ${{ github.event_name == 'push' && !startsWith(github.event.before, '0000000') }}
        run: |
          mapfile -t changed < <(git diff --name-only --diff-filter=AM \
            "${{ github.event.before }}" "${{ github.sha }}" -- 'reports/ai-news-*.html')
          [ ${#changed[@]} -eq 0 ] && { echo "No dailies in this push."; exit 0; }
          python3 scripts/check_report.py "${changed[@]}"
