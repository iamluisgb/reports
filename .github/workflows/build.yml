name: Build manifest

# Regenerates reports.json, sitemap.xml and rss.xml whenever a report is added
# or changed under reports/. The generated files live at the repo root, so the
# commit-back below does NOT re-trigger this workflow (no infinite loop).

on:
  push:
    branches: [master]
    paths:
      - 'reports/**'
      - 'scripts/generate_manifest.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-manifest
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history: needed to date specials with no date in name/content

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate manifest, sitemap and RSS
        run: python3 scripts/generate_manifest.py

      - name: Commit generated files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports.json sitemap.xml rss.xml
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "🤖 Rebuild manifest, sitemap and RSS"
            git push
          fi
